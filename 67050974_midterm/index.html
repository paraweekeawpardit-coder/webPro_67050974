<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js"></script>
    <title>67050974_midterm</title>
</head>
<body>

    <header>
        <h1>Smart Event Hub</h1>
        <nav>
            <button type="button"> <img src="https://cdn-icons-png.flaticon.com/128/4489/4489231.png" alt="moon">Dark Mode</button>
            <button type="button">+ เพิ่มกิจกรรมใหม่</button>
        </nav>
    </header>

    <main>
        <aside>
            <h2> <img src="https://cdn-icons-png.flaticon.com/128/2567/2567943.png" alt="stat">สถิติภาพรวม</h2>
            <p>กิจกรรมทั้งหมด: 0</p>
            <p>ลงทะเบียนแล้ว: 0</p>
            <p>ที่นั่งว่างรวม: 0</p>
        </aside>

        <section>
            <h2><img src="https://cdn-icons-png.flaticon.com/128/3031/3031293.png" alt="search">ค้นหาและกรองข้อมูล</h2>
            <form onsubmit="searchEvent()">
                <div>
                    <label for="search-keyword">ค้นหากิจกรรม / วิทยากร:</label>
                    <input type="text" id="search-keyword" name="search-keyword" placeholder="พิมพ์คำค้นหา...">
                </div>
                <div>
                    <label for="filter-category">ประเภทกิจกรรม:</label>
                    <select id="filter-category" name="filter-category">
                        <option value="all">ทั้งหมด (All)</option>
                        <option value="tech">Tech</option>
                        <option value="design">Design</option>
                        <option value="business">Business</option>
                    </select>
                </div>
                <div>
                    <label for="sort-order">เรียงลำดับตาม:</label>
                    <select id="sort-order" name="sort-order">
                        <option value="date-asc">วันที่ (น้อยไปมาก)</option>
                        <option value="date-desc">วันที่ (มากไปน้อย)</option>
                    </select>
                </div>
                <div>
                    <button type="reset">คืนค่าข้อมูลเริ่มต้น</button>
                    <button type="submit">ค้นหา</button>
                </div>
            </form>
        </section>

        <section>
            <h2>รายการกิจกรรมและเวิร์กช็อป</h2>
            <div id="eventContainer">

            </div>
        </section>

        <aside>
            <h2>เพิ่มกิจกรรมใหม่ (Admin Only)</h2>
            <button type="button" aria-label="Close">×</button>
            
            <form>
                <div>
                    <label for="event-title">ชื่อกิจกรรม *</label>
                    <input type="text" id="event-title" name="event-title" required>
                </div>

                <div>
                    <label for="event-category">ประเภท *</label>
                    <select id="event-category" name="event-category" required>
                        <option value="tech">Tech</option>
                        <option value="design">Design</option>
                        <option value="business">Business</option>
                    </select>
                </div>

                <div>
                    <label for="event-speaker">วิทยากร *</label>
                    <input type="text" id="event-speaker" name="event-speaker">
                </div>

                <div>
                    <label for="event-date">วันที่จัดงาน *</label>
                    <input type="date" id="event-date" name="event-date" required>
                </div>

                <div>
                    <label for="event-seats">จำนวนที่นั่งเปิดรับ *</label>
                    <input type="number" id="event-seats" name="event-seats">
                </div>

                <div>
                    <label for="event-description">รายละเอียดกิจกรรม *</label>
                    <textarea id="event-description" name="event-description"></textarea>
                </div>

                <div>
                    <button type="button">ยกเลิก</button>
                    <button type="submit">บันทึกกิจกรรม</button>
                </div>
            </form>
        </aside>
    </main>
    <footer>
        <p>&copy; 2026 CS Midterm Examination - Web Programming</p>
    </footer>

</body>
</html>
