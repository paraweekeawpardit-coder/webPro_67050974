<!DOCTYPE html> 
<html lang="th"> 
<head> 
 <meta charset="UTF-8"> 
 <title>JavaScript DOM & Event Lab</title> 
 <style> 
 body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; } 
 .form-group { margin-bottom: 15px; } 
 .card{ border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-top: 10px; }  .highlight { background-color: #fff3cd; border-color: #ffeeba; } 
 .text-danger { color: red; } 
 </style> 
</head>
<body> 
 <h2>ฟอร์มลงทะเบียนสมาชิก (Registration Form)</h2> 
  
 <form id="regForm" onsubmit="handleSubmit(event)">
 <div class="form-group"> 
 <label>ชื่อ-นามสกุล:</label> 
 <input type="text" id="fullname" class="input-field" placeholder="กรอกชื่อ-นามสกุล" onkeyup="CheckInput(this.value)">  <span id="nameError" class="text-danger"></span> 
 </div> 
 <div class="form-group"> 
 <label>แผนก/สาขา:</label> 
 <select id="department" class="input-field"  onchange="IfChange(this.value)"> 
 <option value="">-- เลือกแผนก --</option> 
 <option value="IT">เทคโนโลยีสารสนเทศ</option> 
 <option value="MKT">การตลาด</option> 
 <option value="HR">ทรัพยากรบุคคล</option> 
 </select> 
 </div> 
 <div class="form-group"> 
 <label>ระดับประสบการณ์:</label><br> 
 <input type="radio" name="level" value="Junior" class="user-level">Junior  <input type="radio" name="level" value="Senior" class="user-level">Senior  </div> 
 <div class="form-group"> 
 <label>ทักษะความสามารถ(เลือกไดมากกว่า 1):</label><br> 
 <input type="checkbox" name="skills"value="HTML/CSS"  onchange="SkillSelect()"> HTML/CSS
 <input type="checkbox" name="skills" value="JavaScript"  onchange="SkillSelect()">JavaScript  <input type="checkbox" name="skills"value="Database"  onchange="SkillSelect()"> Database  </div> 
 <div class="form-group"> 
 <label>โปรไฟล์รูปภาพ (URL):</label> 
 <input type="text" id="avatarUrl"placeholder="วางลิงกร์ูปภาพที่นี่" onchange="">  </div> 
 <button type="button" id="btnPreview" onclick="showAlert()">ดูตัวอย่างข้อมูล</button>  <button type="submit" id="btnSubmit">ลงทะเบียน</button> 
 </form> 
 <hr> 
 <h3>พื้นที่แสดงผล(Preview Area)</h3> 
 <div id="previewCard" class="card" onmouseover="ChangeColor()" onmouseout="mouseleave()"> 
 <img id="avatarImg" src="https://via.placeholder.com/100" alt="Profile" width="100">  
 <p id="dispName">ชื่อ: -</ย> 
 <p id="dispDept">แผนก: -</p> 
 <p id="dispDetails">รายละเอียด: -</p> 
 <div id="jsonResult"></div> 
 </div> 
 <!-- เขียน JavaScript ไวด้า้นล่างสุด --> 
 <script> 
    // 2.1
    const btnPreview = document.getElementById("btnPreview");
    btnPreview.addEventListener("click", function () {
        console.log("from btnPreview");
    });
    // 2.2
    const input = document.getElementsByClassName("input-field");
    console.log(input);

    // 2.3
    const radio = document.querySelector('input[name="level"]');
    console.log(radio);

    // 2.4

    const checkbox = document.querySelectorAll('input[name="skills"]');

    checkbox.forEach((item) => {
        console.log(item);
    });
    // 3.1
    function showAlert() {
        alert("กำลังประมวลผล")
    }
    // 3.1
    function IfChange(select){
        console.log(select)
    }

    function CheckInput(input) {
        // 3.1
        const nameError = document.getElementById("nameError");

        if (input.length < 3) {
            nameError.textContent = "ชื่อต้องยาวอย่างน้อย 3 ตัวอักษร";
        } else {
            nameError.textContent = "";
        }

        // 4.1

        const name = document.getElementById("dispName");
        name.textContent = input;
        name.innerText = input;
        name.innerHTML = `<b>${input}</b>`;
    }

    // 3.1
    function ChangeColor(){
        const card =document.getElementById("previewCard");
        card.style.backgroundColor = "blue"
    }

    function mouseleave(){
        const card =document.getElementById("previewCard");
        card.style.backgroundColor = ""
    }

    // 3.2
    const regForm = document.getElementById('regForm'); 
    regForm.addEventListener('submit', function(event) { 
    event.preventDefault();
    console.log("Event Type:", event.type); 
    console.log("Target Element:", event.target); 
}); 

// 4.1.2

function SkillSelect() {
    const checked = document.querySelectorAll('input[name="skills"]:checked');
    const skills = [];

    checked.forEach(skill => {
        skills.push(skill.value);
    });
    showSkills(skills);
}

function showSkills(skills) {
    const detail = document.getElementById("dispDetails");

    detail.innerHTML = `
        <ul>
            ${skills.map(skill => `<li>${skill}</li>`).join("")}
        </ul>
    `;
}

// 4.2.1
const avatarUrl = document.getElementById("avatarUrl");
const avatarImg = document.getElementById("avatarImg");
avatarUrl.addEventListener("keyup", function(){
    let oldSrc = avatarImg.getAttribute("src");

    let newUrl = this.value;
    avatarImg.setAttribute("src", newUrl);
});

// 4.4

function handleSubmit(event){
    event.preventDefault();
    const fullname =
    document.getElementById("fullname").value;
    const department =
    document.getElementById("department").value;

    if(fullname === ""){
        alert("กรุณากรอกชื่อ");
        return;
    }

    if(department === ""){
        alert("กรุณาเลือกแผนก");
        return;
    }

    const levelChecked =
    document.querySelector(
        'input[name="level"]:checked'
    );
    let level = "";
    if(levelChecked){
        level = levelChecked.value;
    }

    const skillChecked =
    document.querySelectorAll(
        'input[name="skills"]:checked'
    );

    let skills = [];

    skillChecked.forEach(skill=>{
        skills.push(skill.value);
    });

    const avatarUrl =
    document.getElementById("avatarUrl");

    const userData = {
        fullname: fullname,
        department: department,
        level: level,
        skills: skills,
        avatar: avatarUrl.value
    };
    console.log(userData);
}
 </script> 
</body> 
</html>
